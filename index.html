<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ממלכת רוני</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E7A6F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout concept: one phone-width column; a teal opening screen, then white cards on a cool grey ground. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#E3E8EE; --line:#D3DAE3;
  --ink:#12203A; --muted:#566074;
  --accent:#0E7A6F; --on-accent:#FFFFFF; --accent-soft:#DDF1EE; --accent-ink:#0A5C53;
  --bad:#B4381F; --bad-bg:#FBE5E0; --bad-ink:#8E2B16;
  --warn-bg:#FDF0D5; --warn-ink:#7A4B00; --shadow:#DCE2EA;
  --ui:'Assistant',system-ui,'Segoe UI',Arial,sans-serif;
  --ar:'Noto Naskh Arabic','Geeza Pro','Traditional Arabic','Segoe UI',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620; --surface:#17222E; --surface-2:#243242; --line:#2E3E50;
    --ink:#E9EEF4; --muted:#A9B5C4;
    --accent:#3CC4B2; --on-accent:#062B27; --accent-soft:#143D38; --accent-ink:#8FE6DA;
    --bad:#FF8A72; --bad-bg:#3D1D17; --bad-ink:#FFB4A3;
    --warn-bg:#3A2E10; --warn-ink:#F2CB7A; --shadow:#0A1118;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#17222E; --surface-2:#243242; --line:#2E3E50;
  --ink:#E9EEF4; --muted:#A9B5C4;
  --accent:#3CC4B2; --on-accent:#062B27; --accent-soft:#143D38; --accent-ink:#8FE6DA;
  --bad:#FF8A72; --bad-bg:#3D1D17; --bad-ink:#FFB4A3;
  --warn-bg:#3A2E10; --warn-ink:#F2CB7A; --shadow:#0A1118;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:16px; line-height:1.45;
  padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.on-start{background:var(--accent);color:var(--on-accent)}
#app{max-width:460px;margin:0 auto}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
body.on-start :focus-visible{outline-color:var(--on-accent)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.ar{font-family:var(--ar);direction:rtl;line-height:1.8}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:22px;background:var(--surface);border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none}
.bar-title{font-size:18px;font-weight:700}
.counter{min-width:44px;text-align:left;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:var(--surface-2);margin-bottom:14px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* small pieces */
.chip{display:inline-block;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);padding:4px 10px;border-radius:12px}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.lbl{font-size:14px;font-weight:600;color:var(--muted)}

/* buttons */
.btn{min-height:56px;border-radius:16px;border:0;font-weight:700;font-size:17px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-soft{background:var(--surface);color:var(--ink)}
.btn-bad{background:var(--bad-bg);color:var(--bad-ink)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);cursor:default}

/* start */
.start{min-height:calc(100vh - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.start h1{font-size:36px;line-height:1.15;font-weight:800}
.start .sub{font-size:30px;line-height:1.2;font-weight:700}
.start .btn{width:auto;padding:0 44px;background:var(--on-accent);color:var(--accent-ink);font-size:19px;margin-top:8px}

/* home */
.home-head h1{font-size:28px;line-height:1.2;font-weight:700}
.hero{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .t{font-size:22px;font-weight:700;line-height:1.25}
.hero .btn{background:var(--on-accent);color:var(--accent-ink);align-self:flex-start;width:auto;min-height:48px;font-size:16px;padding:0 22px}
.field{display:flex;flex-direction:column;gap:6px}
.sel{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:18px;padding:14px;border:0;text-align:start;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.tile .ico{width:40px;height:40px;border-radius:20px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.tile .n{font-size:17px;font-weight:700}
.tile .d{font-size:13px;color:var(--muted)}
.unit{background:var(--surface);border-radius:16px;padding:14px 16px;border:2px solid transparent;width:100%;text-align:start;display:flex;flex-direction:column;gap:10px}
.unit[aria-pressed="true"]{border-color:var(--accent)}
.unit .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.unit .nm{font-size:16px;font-weight:700}
.unit .meta{font-size:13px;color:var(--muted);flex:none}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.link-btn{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;text-align:start;font-size:14px;align-self:flex-start;min-height:40px}

/* flashcards */
.flash{width:100%;min-height:330px;border:0;border-radius:28px;background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--shadow);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.big-ar{font-size:68px}
.big-he{font-size:48px;font-weight:700;line-height:1.2}
.ex{width:100%;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ex .ex-ar{font-size:26px}
.note{font-size:14px;color:var(--muted);text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center}

/* matching */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;align-items:start}
.mbtn{width:100%;min-height:68px;border:2px solid transparent;border-radius:16px;background:var(--surface);color:var(--ink);padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.mbtn.he{font-size:19px;font-weight:600;line-height:1.25}
.mbtn.ar{font-size:30px}
.mbtn.sel{border-color:var(--accent)}
.mbtn.done{background:var(--accent-soft);color:var(--accent-ink);cursor:default}
.mbtn.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad)}
.stat{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:14px 16px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}

/* quiz */
.qcard{background:var(--surface);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.qcard .q-ar{font-size:56px}
.qcard .q-ar.sentence{font-size:32px;line-height:1.9}
.qcard .q-he{font-size:36px;font-weight:700;line-height:1.25}
.opt{width:100%;min-height:56px;border-radius:16px;border:2px solid transparent;background:var(--surface);color:var(--ink);padding:8px 18px;text-align:start;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt.ar{font-size:28px;font-weight:400}
.opt.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.opt.dim{color:var(--muted)}
.feedback{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback .v{font-size:16px;font-weight:700}

/* principles */
.pcard{background:var(--surface);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.pcard h2{font-size:24px;line-height:1.2}
.pcard .desc{font-size:17px}
.exrow{border-top:1px solid var(--line);padding:8px 0;font-size:26px}

/* sentence builder */
.slot-area{background:var(--surface);border-radius:24px;padding:16px;min-height:150px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;direction:rtl}
.tok{min-height:56px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font-family:var(--ar);font-size:28px;line-height:1.8;padding:0 18px;box-shadow:0 2px 0 var(--shadow)}
.tok.placed{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.tok.ok{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.tok.bad{background:var(--bad-bg);color:var(--bad-ink);box-shadow:none}
.tok[disabled]{cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:10px;direction:rtl}
.ghost{min-height:52px;width:84px;border:2px dashed var(--line);border-radius:14px}
.sent-he{font-size:26px;font-weight:700;line-height:1.3}

/* results */
.res{background:var(--surface);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.res .big{font-size:54px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.res .t{font-size:22px;font-weight:700}

@media (prefers-reduced-motion: no-preference){
  .btn,.opt,.mbtn,.tok,.unit,.tile{transition:background-color .12s,border-color .12s}
}
</style>

</head>

var S={cards:{},scope:'all',dir:'ar',quiz:'ar2he'};
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); if(o&&typeof o==='object'){ for(var k in o){ S[k]=o[k]; } } }
  }catch(e){}
  if(!S.cards||typeof S.cards!=='object') S.cards={};
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
var view=document.getElementById('view');
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function strip(s){ return s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,'').replace(/[أإآٱ]/g,'ا'); }
function hebKeys(h){
  return h.split(/\s*\/\s*/).map(function(p){
    var m=p.replace(/\(.*?\)/g,'').trim().match(/^[^\s.,]+/);
    return m?m[0]:p;
  });
}
function sameMeaning(a,b){
  var ka=hebKeys(a), kb=hebKeys(b);
  return ka.some(function(x){ return kb.indexOf(x)>=0; });
}
function exampleFor(w){
  var k=strip(w.arabic);
  for(var i=0;i<SENTS.length;i++){
    var s=SENTS[i];
    if(strip(s.arabic)===k) continue;
    var toks=strip(s.arabic).split(/\s+/).map(function(t){return t.replace(/[؟،.!]/g,'');});
    if(toks.indexOf(k)>=0||toks.indexOf('ال'+k)>=0) return s;
  }
  return null;
}
function fixScope(){
  var m=/^u(\d+)$/.exec(S.scope);
  if(S.scope==='all'||S.scope==='names') return;
  if(!m||+m[1]>=UNITS.length) S.scope='all';
}
function scopeUnit(){ var m=/^u(\d+)$/.exec(S.scope); return m?UNITS[+m[1]]:null; }
function wordPool(){
  fixScope();
  if(S.scope==='names') return NAMES.slice();
  var u=scopeUnit();
  return u?WORDS.filter(function(w){return w.unit===u;}):WORDS.slice();
}
function sentPool(){
  var u=scopeUnit();
  var l=u?SENTS.filter(function(s){return s.unit===u;}):SENTS.slice();
  return l.length?l:SENTS.slice();
}
function fillPool(list,n){
  if(list.length>=n) return list.slice();
  var extra=shuffle(WORDS.filter(function(w){return list.indexOf(w)<0;}));
  return list.concat(extra).slice(0,n);
}
function pageRange(items){
  var ps=items.map(function(x){return x.page;});
  if(!ps.length) return '';
  var a=Math.min.apply(null,ps), b=Math.max.apply(null,ps);
  return a===b?("עמ' "+a):("עמ' "+a+"–"+b);
}

/* ---------- spaced repetition ---------- */
function cardQueue(){
  var ws=wordPool(), t=Date.now();
  var due=ws.filter(function(w){return S.cards[w.id]&&S.cards[w.id].d<=t;})
    .sort(function(a,b){return S.cards[a.id].d-S.cards[b.id].d;});
  var fresh=ws.filter(function(w){return !S.cards[w.id];});
  return due.concat(fresh).slice(0,10);
}
function grade(id,ok){
  var c=S.cards[id]||{b:0,d:0};
  if(ok){ c.b=Math.min(5,c.b+1); c.d=Date.now()+INT[c.b]*DAY; }
  else { c.b=0; c.d=Date.now(); }
  S.cards[id]=c; save();
}

      '<div>ההתקדמות נשמרת בדפדפן של הטלפון הזה, ולכל אחד יש התקדמות משלו.</div>'+
      '<div>כדי לפתוח כמו אפליקציה: בתפריט הדפדפן בחר "הוסף למסך הבית".</div>'+
      '<div>התוכן מתוך החוברת "ערבית למתחילים", המחלקה לערבית, אוניברסיטת בר-אילן. מהדורת ניסוי, לשימוש פנימי.</div>'+
      (confirmReset
        ? '<div class="row2"><button class="btn btn-bad" style="min-height:48px;font-size:15px" data-act="resetYes">כן, למחוק</button><button class="btn btn-soft" style="min-height:48px;font-size:15px" data-act="resetNo">ביטול</button></div>'
        : '<button class="link-btn" data-act="reset">איפוס ההתקדמות</button>')+
    '</div></div>');
}
ACT.scope=function(d){ S.scope=d.v; save(); home(); window.scrollTo(0,0); };
ACT.names=function(){ S.scope='names'; S.quiz='ar2he'; save(); go('quiz'); };
ACT.reset=function(){ confirmReset=true; home(); };
ACT.resetNo=function(){ confirmReset=false; home(); };
ACT.resetYes=function(){ confirmReset=false; S.cards={}; save(); home(); };

/* --- flashcards --- */
var C=null;
function cards(){
  var queue=cardQueue(), practice=false;
  if(!queue.length){ practice=true; queue=shuffle(wordPool()).slice(0,10); }
  C={queue:queue,i:0,flip:false,known:0,again:0,rq:{},practice:practice};
  renderCards();
}
function renderCards(){
  if(C.i>=C.queue.length) return cardsDone();
  var w=C.queue[C.i], ex=exampleFor(w), arFirst=(S.dir==='ar');
  var front, back;
  if(arFirst){
    front='<div class="lbl">ערבית</div><div class="ar big-ar">'+esc(w.arabic)+'</div><div class="muted" style="font-size:14px">הקש כדי לראות את התרגום</div>';
    back='<div class="lbl">עברית</div><div class="big-he">'+esc(w.hebrew)+'</div>';
  } else {
    front='<div class="lbl">עברית</div><div class="big-he">'+esc(w.hebrew)+'</div><div class="muted" style="font-size:14px">הקש כדי לראות את הערבית</div>';
    back='<div class="lbl">ערבית</div><div class="ar big-ar">'+esc(w.arabic)+'</div>';
  }
  var exHtml=ex?('<div class="ex"><div class="lbl">מתוך התרגול</div><div class="ar ex-ar">'+esc(ex.arabic)+'</div><div>'+esc(ex.hebrew)+'</div></div>'):'';
  setView(bar('כרטיסיות',(C.i+1)+' / '+C.queue.length)+progress(C.i/C.queue.length)+
    '<div class="seg" role="group" aria-label="כיוון">'+
      '<button data-act="dir" data-v="ar" aria-pressed="'+arFirst+'">ערבית קודם</button>'+
      '<button data-act="dir" data-v="he" aria-pressed="'+(!arFirst)+'">עברית קודם</button></div>'+
    '<div class="stack-s" style="margin-bottom:6px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip">'+esc(w.unit)+'</span><span class="lbl">עמ\' '+w.page+'</span>'+
      (C.practice?'<span class="chip warn">תרגול חופשי</span>':'')+'</div></div>'+
    '<div class="stack">'+
    '<button class="flash" data-act="flip" aria-label="הפוך כרטיס">'+(C.flip?(back+exHtml):front)+'</button>'+
    (C.flip
      ? '<div class="row2"><button class="btn btn-bad" data-act="again">'+ICON.cross+'עוד לא</button><button class="btn btn-primary" data-act="know">'+ICON.check+'ידעתי</button></div>'
      : '<div class="note">קודם הפוך את הכרטיס, ואז סמן אם ידעת</div>')+
    '</div>');
}
function cardsDone(){
  var total=C.known+C.again;
  resultsView('כרטיסיות',String(C.known),'מתוך '+total+' כרטיסים ידעת',
    C.practice?'זה היה תרגול חופשי, לוח החזרות לא השתנה.':'הכרטיסים שלא ידעת יחזרו בסבב הבא.','cards');
}
ACT.flip=function(){ C.flip=!C.flip; renderCards(); };
ACT.dir=function(d){ S.dir=d.v; save(); if(C){ C.flip=false; renderCards(); } };
ACT.know=function(){
  var w=C.queue[C.i];
  if(!C.practice) grade(w.id,true);
  C.known++; C.i++; C.flip=false; renderCards();
};
ACT.again=function(){
  var w=C.queue[C.i];
  if(!C.practice) grade(w.id,false);
  C.again++;
  if(!C.rq[w.id]){ C.rq[w.id]=true; C.queue.push(w); }
  C.i++; C.flip=false; renderCards();
};

/* --- matching --- */
var M=null;
function match(){
  var pool=fillPool(shuffle(wordPool()),6), pairs=[], seenH=[], seenA=[];
  pool.forEach(function(w){
    if(pairs.length>=6) return;
    var dup=seenH.some(function(h){return sameMeaning(h,w.hebrew);})||seenA.indexOf(w.arabic)>=0;
    if(dup) return;
    seenH.push(w.hebrew); seenA.push(w.arabic); pairs.push(w);
  });
  var dpool=shuffle(wordPool().slice()).concat(shuffle((S.scope==='names'?NAMES:WORDS).slice()));
  M={pairs:pairs,a:shuffle(pairs.slice()),h:shuffle(pairs.slice()),selA:null,selH:null,done:{},mistakes:0,bad:null,dpool:dpool,dpos:0};
  renderMatch();
}
function renderMatch(){
  var doneN=Object.keys(M.done).length;
  function btn(side,w){
    var id=w.id, isDone=!!M.done[id];
    var sel=(side==='a'?M.selA:M.selH)===id;
    var bad=M.bad&&M.bad[side]===id;
    var cls='mbtn '+(side==='a'?'ar':'he')+(isDone?' done':'')+(sel&&!bad?' sel':'')+(bad?' bad':'');
    var txt=esc(side==='a'?w.arabic:w.hebrew);
    return '<button class="'+cls+'" data-act="m'+side+'" data-id="'+id+'"'+(isDone?' disabled':'')+' aria-pressed="'+(sel?'true':'false')+'">'+
      (isDone?ICON.check:'')+'<span>'+txt+'</span></button>';
  }
  setView(bar('התאמה',doneN+' / '+M.pairs.length)+progress(doneN/M.pairs.length)+
    '<div class="stack"><div><div style="font-size:20px;font-weight:700;line-height:1.3">התאם כל מילה לתרגום שלה</div>'+
    '<div class="muted" style="font-size:14px">בחר מילה בערבית ואת התרגום שלה בעברית. בערבית יש גם מילים מיותרות.</div></div>'+
    '<div class="mgrid"><div class="stack-s"><div class="lbl">ערבית</div>'+M.a.map(function(w){return btn('a',w);}).join('')+'</div>'+
    '<div class="stack-s"><div class="lbl">עברית</div>'+M.h.map(function(w){return btn('h',w);}).join('')+'</div></div>'+
    '<div class="stat"><span class="muted">טעויות במשחק</span><b>'+M.mistakes+'</b></div></div>');
}
/* a decoy is an Arabic word whose translation is not on the board */
function nextDecoy(){
  while(M.dpos<M.dpool.length){
    var c=M.dpool[M.dpos++];
    var clash=M.pairs.some(function(p){
      return p.id===c.id||strip(p.arabic)===strip(c.arabic)||sameMeaning(p.hebrew,c.hebrew);
    })||M.a.some(function(x){ return strip(x.arabic)===strip(c.arabic); });
    if(!clash) return c;
  }
  return null;
}
function swapArabic(id){
  var idx=-1;
  M.a.forEach(function(w,i){ if(w.id===id) idx=i; });
  var d=nextDecoy();
  if(idx>=0&&d) M.a[idx]=d;
  renderMatch();
}
function matchPick(side,id){
  if(M.done[id]||M.bad) return;
  if(side==='a') M.selA=id; else M.selH=id;
  if(M.selA&&M.selH){
    if(M.selA===M.selH){
      var okId=M.selA; M.done[okId]=true; M.selA=null; M.selH=null;
      if(Object.keys(M.done).length===M.pairs.length){
        renderMatch();
        later(function(){
          resultsView('התאמה',String(M.mistakes),M.mistakes===0?'בלי אף טעות':'טעויות בסבב','כל הזוגות הותאמו.','match');
        },450);
        return;
      }
      var g=M;
      later(function(){ if(M===g) swapArabic(okId); },400);
    } else {
      M.mistakes++; M.bad={a:M.selA,h:M.selH}; M.selA=null; M.selH=null;
      renderMatch();
      later(function(){ if(M){ M.bad=null; renderMatch(); } },650);
      return;
    }
  }
  renderMatch();
}
ACT.ma=function(d){ matchPick('a',d.id); };
ACT.mh=function(d){ matchPick('h',d.id); };

/* --- quiz --- */
var Q=null;
function quiz(){
  var qs=[];
  if(S.quiz==='sent'){
    qs=shuffle(sentPool()).slice(0,10).map(function(s){
      var others=shuffle(SENTS.filter(function(x){return x.hebrew!==s.hebrew;})).slice(0,3);
      var opts=shuffle([{t:s.hebrew,ok:true}].concat(others.map(function(o){return {t:o.hebrew,ok:false};})));
      return {kind:'sent',s:s,opts:opts};
    });
  } else {
    var dp=S.scope==='names'?NAMES:WORDS;
    var he2ar=(S.quiz==='he2ar');
    qs=shuffle(wordPool()).slice(0,10).map(function(w){
      var others=shuffle(dp.filter(function(x){
        return x.id!==w.id&&x.arabic!==w.arabic&&!sameMeaning(x.hebrew,w.hebrew);
      })).slice(0,3);
      var all=[w].concat(others);
      var opts=shuffle(all.map(function(x){return {t:he2ar?x.arabic:x.hebrew,ok:x.id===w.id};}));
      return {kind:he2ar?'he2ar':'ar2he',w:w,opts:opts};
    });
  }
  Q={qs:qs,i:0,picked:null,score:0};
  renderQuiz();
}
function renderQuiz(){
  if(Q.i>=Q.qs.length) return quizDone();
  var q=Q.qs[Q.i], answered=Q.picked!==null;
  var prompt, lab='מה פירוש המילה?';
  if(q.kind==='ar2he'){ prompt='<div class="ar q-ar">'+esc(q.w.arabic)+'</div>'; }
  else if(q.kind==='he2ar'){ lab='איך אומרים בערבית?'; prompt='<div class="q-he">'+esc(q.w.hebrew)+'</div>'; }
  else { lab='מה פירוש המשפט?'; prompt='<div class="ar q-ar sentence">'+esc(q.s.arabic)+'</div>'; }
  var optHtml=q.opts.map(function(o,k){
    var cls='opt'+(q.kind==='he2ar'?' ar':'');
    var icon='';
    if(answered){
      if(o.ok){ cls+=' ok'; icon=ICON.check; }
      else if(Q.picked===k){ cls+=' bad'; icon=ICON.cross; }
      else cls+=' dim';
    }
    return '<button class="'+cls+'" data-act="qpick" data-i="'+k+'"'+(answered?' disabled':'')+'><span'+(q.kind==='he2ar'?' class="ar"':'')+'>'+esc(o.t)+'</span>'+icon+'</button>';
  }).join('');
  var fb='';
  if(answered){
    var right=q.opts.filter(function(o){return o.ok;})[0];
    var ok=q.opts[Q.picked].ok;
    var info=q.kind==='sent'?q.s:q.w, ex=q.kind==='sent'?null:exampleFor(q.w);
    fb='<div class="feedback" aria-live="polite"><div class="v">'+(ok?'נכון!':'התשובה: ')+(ok?'':'<span'+(q.kind==='he2ar'?' class="ar"':'')+'>'+esc(right.t)+'</span>')+'</div>'+
      (q.kind==='sent'?'':'<div class="lbl">'+esc(q.w.arabic)+' · '+esc(q.w.hebrew)+'</div>')+
      (ex?'<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div class="ar" style="font-size:24px">'+esc(ex.arabic)+'</div><div class="muted" style="font-size:15px">'+esc(ex.hebrew)+'</div></div>':'')+
      '<div class="lbl">עמ\' '+info.page+' · '+esc(info.unit)+'</div></div>';
  }
  setView(bar('מבחן',(Q.i+1)+' / '+Q.qs.length)+progress(Q.i/Q.qs.length)+
    '<div class="seg" role="group" aria-label="סוג מבחן">'+
      '<button data-act="qkind" data-v="ar2he" aria-pressed="'+(S.quiz==='ar2he')+'">מערבית לעברית</button>'+
      '<button data-act="qkind" data-v="he2ar" aria-pressed="'+(S.quiz==='he2ar')+'">מעברית לערבית</button>'+
      '<button data-act="qkind" data-v="sent" aria-pressed="'+(S.quiz==='sent')+'">משפטים</button></div>'+
    '<div class="stack"><div class="qcard"><div class="muted">'+lab+'</div>'+prompt+'</div>'+
    '<div class="stack-s">'+optHtml+'</div>'+fb+
    (answered?'<button class="btn btn-primary" data-act="qnext">'+(Q.i+1>=Q.qs.length?'לתוצאה':'לשאלה הבאה')+'</button>':'')+'</div>');
}
function quizDone(){
  resultsView('מבחן',Q.score+' / '+Q.qs.length,Q.score===Q.qs.length?'מושלם':'סיימת את המבחן',
    'מילים שטעית בהן חזרו לכרטיסיות לחזרה.','quiz');
}
ACT.qpick=function(d){
  if(Q.picked!==null) return;
  var q=Q.qs[Q.i], k=+d.i;
  Q.picked=k;
  if(q.opts[k].ok) Q.score++;
  else if(q.kind!=='sent'){ S.cards[q.w.id]={b:0,d:Date.now()}; save(); }
  renderQuiz();
};
ACT.qnext=function(){ Q.i++; Q.picked=null; renderQuiz(); window.scrollTo(0,0); };
ACT.qkind=function(d){ S.quiz=d.v; save(); quiz(); };

/* --- principles --- */
var P=null;
function principles(){ P={i:0}; renderPrinciples(); }
function renderPrinciples(){
  var p=PRINC[P.i];
  var exs=p.examples?p.examples.split(/,\s*/):[];
  setView(bar('עקרונות',(P.i+1)+' / '+PRINC.length)+progress((P.i+1)/PRINC.length)+
    '<div class="stack"><div class="pcard">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="chip">עמ\' '+p.page+'</span>'+
      (p.status!=='אומת'?'<span class="chip warn">טיוטה · ממתין לניסוח המרצה</span>':'')+'</div>'+
      '<h2>'+esc(p.name)+'</h2><p class="desc">'+esc(p.description)+'</p>'+
      (exs.length?'<div><div class="lbl" style="margin-bottom:4px">דוגמאות</div>'+exs.map(function(e){return '<div class="exrow ar">'+esc(e)+'</div>';}).join('')+'</div>':'')+
    '</div>'+
    '<div class="row2"><button class="btn btn-soft" data-act="pprev"'+(P.i===0?' disabled':'')+'>העיקרון הקודם</button>'+
    '<button class="btn btn-primary" data-act="pnext"'+(P.i===PRINC.length-1?' disabled':'')+'>העיקרון הבא</button></div></div>');
}
ACT.pprev=function(){ if(P.i>0){ P.i--; renderPrinciples(); window.scrollTo(0,0);} };
ACT.pnext=function(){ if(P.i<PRINC.length-1){ P.i++; renderPrinciples(); window.scrollTo(0,0);} };

/* --- sentence builder --- */
var T=null;
function sentOk(s){ var n=s.arabic.split(/\s+/).length; return n>=3&&n<=8; }
function sentence(){
  var pl=sentPool().filter(sentOk);
  if(pl.length<3) pl=SENTS.filter(sentOk);
  var allToks=[];
  SENTS.forEach(function(s){ s.arabic.split(/\s+/).forEach(function(t){ if(t.indexOf('؟')<0) allToks.push(t); }); });
  var list=shuffle(pl).slice(0,8).map(function(s){
    var toks=s.arabic.split(/\s+/);
    var have=toks.map(strip), extra=[];
    shuffle(allToks.slice()).forEach(function(t){
      if(extra.length>=2) return;
      var st=strip(t);
      if(have.indexOf(st)>=0||extra.some(function(e){return strip(e)===st;})) return;
      extra.push(t);
    });
    var bank=shuffle(toks.concat(extra).map(function(t,k){return {k:k,t:t};}));
    return {s:s,toks:toks,bank:bank};
  });
  T={list:list,i:0,placed:[],checked:null,ok:0};
  renderSentence();
}
function renderSentence(){
  if(T.i>=T.list.length) return sentDone();
  var it=T.list[T.i], checked=T.checked!==null;
  var byK={}; it.bank.forEach(function(b){byK[b.k]=b;});
  var placedHtml=T.placed.map(function(k){
    var cls='tok placed'+(checked?(T.checked?' ok':' bad'):'');
    return '<button class="'+cls+'" data-act="tunplace" data-k="'+k+'"'+(checked?' disabled':'')+' aria-label="הסר את המילה '+esc(byK[k].t)+'">'+esc(byK[k].t)+'</button>';
  }).join('');
  var ghosts='';
  if(!checked){ for(var g=T.placed.length;g<it.toks.length&&g<T.placed.length+2;g++) ghosts+='<div class="ghost"></div>'; }
  var bankHtml=it.bank.filter(function(b){return T.placed.indexOf(b.k)<0;}).map(function(b){
    return '<button class="tok" data-act="tpick" data-k="'+b.k+'"'+(checked?' disabled':'')+'>'+esc(b.t)+'</button>';
  }).join('');
  var fb='';
  if(checked){
    fb='<div class="feedback" aria-live="polite"><div class="v">'+(T.checked?'נכון!':'לא מדויק. התשובה הנכונה:')+'</div>'+
      (T.checked?'':'<div class="ar" style="font-size:28px">'+esc(it.s.arabic)+'</div>')+
      '<div class="lbl">עמ\' '+it.s.page+' · '+esc(it.s.unit)+'</div></div>';
  }
  setView(bar('בניית משפט',(T.i+1)+' / '+T.list.length)+progress(T.i/T.list.length)+
    '<div class="stack"><div class="stack-s"><div class="muted" style="font-size:14px">הרכב בערבית את המשפט:</div><div class="sent-he">'+esc(it.s.hebrew)+'</div></div>'+
    '<div class="slot-area" aria-label="המשפט שהרכבת">'+placedHtml+ghosts+'</div>'+
    (checked?'':'<div class="stack-s"><div class="lbl">מילים לבחירה</div><div class="bank">'+bankHtml+'</div></div>')+
    fb+
    (checked
      ? '<button class="btn btn-primary" data-act="tnext">'+(T.i+1>=T.list.length?'לתוצאה':'למשפט הבא')+'</button>'
      : '<div class="row2"><button class="btn btn-soft" data-act="tclear"'+(T.placed.length?'':' disabled')+'>נקה</button><button class="btn btn-primary" data-act="tcheck"'+(T.placed.length?'':' disabled')+'>בדיקה</button></div>')+
    '</div>');
}
function sentDone(){
  resultsView('בניית משפט',T.ok+' / '+T.list.length,T.ok===T.list.length?'מושלם':'סיימת את הסבב','התשובה נחשבת נכונה רק כשהסדר זהה לחוברת.','sentence');
}
ACT.tpick=function(d){ if(T.checked!==null) return; T.placed.push(+d.k); renderSentence(); };
ACT.tunplace=function(d){ if(T.checked!==null) return; var k=+d.k; T.placed=T.placed.filter(function(x){return x!==k;}); renderSentence(); };
ACT.tclear=function(){ T.placed=[]; renderSentence(); };
ACT.tcheck=function(){
  var it=T.list[T.i], byK={};
  it.bank.forEach(function(b){byK[b.k]=b;});
  var ans=T.placed.map(function(k){return byK[k].t;}).join(' ');
  T.checked=(ans===it.s.arabic);
  if(T.checked) T.ok++;
  renderSentence();
};
ACT.tnext=function(){ T.i++; T.placed=[]; T.checked=null; renderSentence(); window.scrollTo(0,0); };

ACT.restart=function(d){ go(d.v,true); };

/* ---------- router ---------- */
var ROUTES={start:start,home:home,cards:cards,match:match,quiz:quiz,principles:principles,sentence:sentence};
function route(){
  timers.forEach(clearTimeout); timers=[];
  var h=(location.hash||'').replace('#','');
  var name=ROUTES[h]?h:'start';
  confirmReset=false;
  ROUTES[name]();
  window.scrollTo(0,0);
}
function go(name,force){
  if(location.hash==='#'+name){ route(); }
  else { location.hash=name; }
}

view.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t||t.disabled) return;
  var f=ACT[t.dataset.act];
  if(f) f(t.dataset,t);
});
view.addEventListener('change',function(e){
  if(e.target&&e.target.id==='scope'){ S.scope=e.target.value; save(); home(); }
});
window.addEventListener('hashchange',route);

load();
route();
})();
</script>
