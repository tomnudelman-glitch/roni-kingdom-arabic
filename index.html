<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ממלכת רוני</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E7A6F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600&family=Rubik:wght@500;600;700;800&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout concept: one phone-width column over a field of faint Arabic letters. Every mode owns a hue (set by .m-*), and buttons are chunky and press down. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#E6EAF2; --line:#D5DCE8;
  --ink:#14213D; --muted:#56627A;
  --accent:#0E7A6F; --on-accent:#FFFFFF; --accent-soft:#DDF1EE; --accent-ink:#0A5C53;
  --bad:#B4381F; --bad-bg:#FBE5E0; --bad-ink:#8E2B16;
  --warn-bg:#FDF0D5; --warn-ink:#7A4B00;
  --glyph:rgba(14,122,111,.10); --edge:rgba(0,0,0,.18);
  --h-teal:#0E7A6F; --h-teal-s:#DDF1EE; --h-teal-i:#0A5C53; --h-teal-o:#FFFFFF;
  --h-orange:#B84F08; --h-orange-s:#FFE8D1; --h-orange-i:#8A3F00; --h-orange-o:#FFFFFF;
  --h-purple:#6D3FD0; --h-purple-s:#EADFFB; --h-purple-i:#4B2A8A; --h-purple-o:#FFFFFF;
  --h-blue:#2468C9; --h-blue-s:#DCEBFF; --h-blue-i:#124A99; --h-blue-o:#FFFFFF;
  --h-pink:#C42B6B; --h-pink-s:#FFDDEB; --h-pink-i:#8C1F58; --h-pink-o:#FFFFFF;
  --h-green:#2A7A10; --h-green-s:#DCF3D2; --h-green-i:#2D6A12; --h-green-o:#FFFFFF;
  --h-coral:#C93822; --h-coral-s:#FFE1DC; --h-coral-i:#8E2B16; --h-coral-o:#FFFFFF;
  --h-slate:#40506E; --h-slate-s:#E3E8F0; --h-slate-i:#14213D; --h-slate-o:#FFFFFF;
  --ui:'Assistant',system-ui,'Segoe UI',Arial,sans-serif;
  --disp:'Rubik','Assistant',system-ui,'Segoe UI',Arial,sans-serif;
  --ar:'Noto Naskh Arabic','Geeza Pro','Traditional Arabic','Segoe UI',serif;
  --kufi:'Reem Kufi','Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620; --surface:#17222E; --surface-2:#243242; --line:#2E3E50;
    --ink:#E9EEF4; --muted:#A9B5C4;
    --accent:#3CC4B2; --on-accent:#062B27; --accent-soft:#143D38; --accent-ink:#8FE6DA;
    --bad:#FF8A72; --bad-bg:#3D1D17; --bad-ink:#FFB4A3;
    --warn-bg:#3A2E10; --warn-ink:#F2CB7A;
    --glyph:rgba(143,230,218,.07); --edge:rgba(0,0,0,.35);
    --h-teal:#3CC4B2; --h-teal-s:#143D38; --h-teal-i:#8FE6DA; --h-teal-o:#062B27;
    --h-orange:#FFA24D; --h-orange-s:#3F2A12; --h-orange-i:#FFC48A; --h-orange-o:#3A1B00;
    --h-purple:#B79BFF; --h-purple-s:#2A2145; --h-purple-i:#CDBAFF; --h-purple-o:#20104A;
    --h-blue:#7FB2FF; --h-blue-s:#15294A; --h-blue-i:#A9CBFF; --h-blue-o:#0B2147;
    --h-pink:#FF8DB8; --h-pink-s:#46182F; --h-pink-i:#FFB3D1; --h-pink-o:#3F0A25;
    --h-green:#8BDB6A; --h-green-s:#1C3815; --h-green-i:#B4EE9B; --h-green-o:#12300A;
    --h-coral:#FF8A72; --h-coral-s:#43211B; --h-coral-i:#FFB4A3; --h-coral-o:#3D1208;
    --h-slate:#8FA3C7; --h-slate-s:#243044; --h-slate-i:#DCE5F5; --h-slate-o:#0E1620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0E1620; --surface:#17222E; --surface-2:#243242; --line:#2E3E50;
    --ink:#E9EEF4; --muted:#A9B5C4;
    --accent:#3CC4B2; --on-accent:#062B27; --accent-soft:#143D38; --accent-ink:#8FE6DA;
    --bad:#FF8A72; --bad-bg:#3D1D17; --bad-ink:#FFB4A3;
    --warn-bg:#3A2E10; --warn-ink:#F2CB7A;
    --glyph:rgba(143,230,218,.07); --edge:rgba(0,0,0,.35);
    --h-teal:#3CC4B2; --h-teal-s:#143D38; --h-teal-i:#8FE6DA; --h-teal-o:#062B27;
    --h-orange:#FFA24D; --h-orange-s:#3F2A12; --h-orange-i:#FFC48A; --h-orange-o:#3A1B00;
    --h-purple:#B79BFF; --h-purple-s:#2A2145; --h-purple-i:#CDBAFF; --h-purple-o:#20104A;
    --h-blue:#7FB2FF; --h-blue-s:#15294A; --h-blue-i:#A9CBFF; --h-blue-o:#0B2147;
    --h-pink:#FF8DB8; --h-pink-s:#46182F; --h-pink-i:#FFB3D1; --h-pink-o:#3F0A25;
    --h-green:#8BDB6A; --h-green-s:#1C3815; --h-green-i:#B4EE9B; --h-green-o:#12300A;
    --h-coral:#FF8A72; --h-coral-s:#43211B; --h-coral-i:#FFB4A3; --h-coral-o:#3D1208;
    --h-slate:#8FA3C7; --h-slate-s:#243044; --h-slate-i:#DCE5F5; --h-slate-o:#0E1620;
    color-scheme:dark;
  }

*{box-sizing:border-box}
html{height:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:16px; line-height:1.45;
  padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.on-start{background:var(--h-teal);color:var(--h-teal-o);--glyph:rgba(255,255,255,.16)}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg .g{position:absolute;font-family:var(--kufi);color:var(--glyph);line-height:1;user-select:none;white-space:nowrap}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--mi,var(--accent-ink));outline-offset:2px}
body.on-start :focus-visible{outline-color:var(--h-teal-o)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-family:var(--disp)}
.ar{font-family:var(--ar);direction:rtl;line-height:1.8}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}

/* one hue per mode */
.m-teal{--m:var(--h-teal);--ms:var(--h-teal-s);--mi:var(--h-teal-i);--mo:var(--h-teal-o)}
.m-orange{--m:var(--h-orange);--ms:var(--h-orange-s);--mi:var(--h-orange-i);--mo:var(--h-orange-o)}
.m-purple{--m:var(--h-purple);--ms:var(--h-purple-s);--mi:var(--h-purple-i);--mo:var(--h-purple-o)}
.m-blue{--m:var(--h-blue);--ms:var(--h-blue-s);--mi:var(--h-blue-i);--mo:var(--h-blue-o)}
.m-pink{--m:var(--h-pink);--ms:var(--h-pink-s);--mi:var(--h-pink-i);--mo:var(--h-pink-o)}
.m-green{--m:var(--h-green);--ms:var(--h-green-s);--mi:var(--h-green-i);--mo:var(--h-green-o)}
.m-coral{--m:var(--h-coral);--ms:var(--h-coral-s);--mi:var(--h-coral-i);--mo:var(--h-coral-o)}
.m-slate{--m:var(--h-slate);--ms:var(--h-slate-s);--mi:var(--h-slate-i);--mo:var(--h-slate-o)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:22px;background:var(--surface);border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 0 var(--line)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.bar-title{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--mi)}
.counter{min-width:44px;text-align:left;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:12px;border-radius:6px;background:var(--surface-2);margin-bottom:12px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:6px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--m)}

/* small pieces */
.chip{display:inline-block;font-size:13px;font-weight:600;background:var(--ms);color:var(--mi);padding:4px 10px;border-radius:12px}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.new{background:var(--h-green-s);color:var(--h-green-i)}
.chip.lv{background:var(--surface-2);color:var(--ink)}
/* levels */
.lvbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.lvbar i{display:block;height:100%}
.lvleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.lvleg b{color:var(--ink);font-variant-numeric:tabular-nums}
.lvleg .sw{display:inline-block;width:10px;height:10px;border-radius:5px;margin-inline-end:6px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.wk .ar{font-size:22px;line-height:1.5}
.wk .cnt{font-size:13px;font-weight:600;background:var(--warn-bg);color:var(--warn-ink);padding:4px 10px;border-radius:12px;white-space:nowrap}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg button{min-height:38px;padding:0 14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--disp);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ms);color:var(--mi);border-color:var(--m)}
.lbl{font-size:14px;font-weight:600;color:var(--muted)}

/* buttons */
.btn{min-height:56px;border-radius:18px;border:0;font-family:var(--disp);font-weight:700;font-size:17px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;box-shadow:0 4px 0 var(--edge)}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn-primary{background:var(--m);color:var(--mo)}
.btn-soft{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn-soft:active:not([disabled]){box-shadow:0 1px 0 var(--line)}
.btn-bad{background:var(--bad-bg);color:var(--bad-ink)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:default}

/* start */
.start{min-height:calc(100vh - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.crown-lg{width:116px;height:116px;border-radius:58px;background:var(--h-teal-o);color:var(--h-teal);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--edge)}
.start h1{font-size:36px;line-height:1.15;font-weight:800}
.start .sub{font-family:var(--disp);font-size:30px;line-height:1.2;font-weight:700}
.start .btn{width:auto;padding:0 48px;background:var(--h-teal-o);color:var(--h-teal-i);font-size:19px;margin-top:8px}

/* home */
.brand{display:flex;align-items:center;gap:12px}
.crown{width:54px;height:54px;flex:none;border-radius:27px;background:var(--h-orange);color:var(--h-orange-o);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--edge)}
.brand h1{font-size:30px;line-height:1.1;font-weight:800}
.brand .sub{font-size:15px;color:var(--muted)}
.hero{position:relative;overflow:hidden;background:var(--h-teal);color:var(--h-teal-o);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 5px 0 var(--edge)}
.hero::after{content:"أبجد";font-family:var(--kufi);position:absolute;left:-4px;bottom:-26px;font-size:104px;line-height:1;opacity:.2;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .t{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.25}
.hero .btn{background:var(--h-teal-o);color:var(--h-teal-i);align-self:flex-start;width:auto;min-height:48px;font-size:16px;padding:0 22px}
.field{display:flex;flex-direction:column;gap:6px}
.sel{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--ms);color:var(--mi);border-radius:20px;padding:14px;border:0;text-align:start;display:flex;flex-direction:column;gap:10px;text-decoration:none;box-shadow:0 4px 0 var(--m);min-height:112px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--m)}
.tile .ico{width:42px;height:42px;border-radius:21px;background:var(--m);color:var(--mo);display:flex;align-items:center;justify-content:center}
.tile .n{font-family:var(--disp);font-size:18px;font-weight:700}
.tile .d{font-size:13px}
.tile.wide{flex-direction:row;align-items:center;gap:14px;min-height:0}
.tile.wide .t{flex:1;min-width:0}
.tile.solid{background:var(--m);color:var(--mo);box-shadow:0 4px 0 var(--edge)}
.tile.solid:active{box-shadow:0 1px 0 var(--edge)}
.tile.solid .ico{background:var(--mo);color:var(--m)}
.unit{background:var(--surface);border-radius:16px;padding:14px 16px;border:2px solid transparent;width:100%;text-align:start;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 var(--line)}
.unit[aria-pressed="true"]{border-color:var(--m)}
.unit .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.unit .nm{font-family:var(--disp);font-size:16px;font-weight:700}
.unit .meta{font-size:13px;color:var(--muted);flex:none}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.link-btn{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;text-align:start;font-size:14px;align-self:flex-start;min-height:40px}

/* flashcards */
.flash{width:100%;min-height:min(330px,38vh);border:2px solid var(--line);border-radius:28px;background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.big-ar{font-size:68px}
.big-he{font-family:var(--disp);font-size:46px;font-weight:700;line-height:1.2}
.ex{width:100%;border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ex .ex-ar{font-size:26px}
.note{font-size:14px;color:var(--muted);text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center}

/* matching */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;align-items:start}
.mbtn{width:100%;min-height:66px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 3px 0 var(--line)}
.mbtn.he{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.25}
.mbtn.ar{font-size:30px}
.mbtn.sel{border-color:var(--m);background:var(--ms);color:var(--mi);box-shadow:0 3px 0 var(--m)}
.mbtn.done{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;box-shadow:none;cursor:default}
.mbtn.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad);box-shadow:none}
.stat{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:12px 16px;box-shadow:0 3px 0 var(--line)}
.stat b{font-family:var(--disp);font-size:20px;font-variant-numeric:tabular-nums}

/* quiz */
.qcard{background:var(--surface);border-radius:22px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;box-shadow:0 4px 0 var(--m)}
.qcard .qtag{align-self:center}
.qcard .q-ar{font-size:46px;line-height:1.5}
.qcard .q-ar.sentence{font-size:28px;line-height:1.8}
.qcard .q-he{font-family:var(--disp);font-size:32px;font-weight:700;line-height:1.25}
.qcard .q-he.sentence{font-size:24px}
.blank{display:inline-block;min-width:68px;height:1em;border-bottom:4px solid var(--m);margin:0 6px;vertical-align:-.1em}
.opt{width:100%;min-height:50px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 16px;text-align:start;font-family:var(--disp);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 3px 0 var(--line)}
.opt.ar{font-family:var(--ar);font-size:25px;font-weight:400;line-height:1.6}
.opt.ar.long{font-size:21px}
.opt.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink);box-shadow:none}
.opt.dim{color:var(--muted);box-shadow:none}
.feedback{background:var(--surface);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 var(--line)}
.feedback .v{font-family:var(--disp);font-size:16px;font-weight:700}

/* principles */
.pcard{background:var(--surface);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 var(--m)}
.pcard h2{font-size:24px;line-height:1.2}
.pcard .desc{font-size:17px}
.exrow{border-top:2px dashed var(--line);padding:8px 0;font-size:26px}

/* sentence builder */
.slot-area{background:var(--surface);border-radius:22px;padding:14px;min-height:110px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;direction:rtl;box-shadow:0 4px 0 var(--m)}
.tok{min-height:54px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font-family:var(--ar);font-size:28px;line-height:1.7;padding:0 18px;box-shadow:0 3px 0 var(--line)}
.tok:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tok.placed{background:var(--ms);color:var(--mi);box-shadow:none}
.tok.ok{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}
.tok.bad{background:var(--bad-bg);color:var(--bad-ink);box-shadow:none}
.tok[disabled]{cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:10px;direction:rtl}
.ghost{min-height:50px;width:80px;border:2px dashed var(--line);border-radius:14px}
.sent-he{font-family:var(--disp);font-size:25px;font-weight:700;line-height:1.3}

/* vocabulary */
.search{width:100%;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font-size:18px;font-family:inherit}
.search:focus{border-color:var(--m);outline:none}
.search::placeholder{color:var(--muted)}
.vgroup{display:flex;flex-direction:column;gap:8px}
.vgroup h2{font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.vgroup h2 span{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.vrow{background:var(--surface);border-radius:16px;padding:10px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;row-gap:2px;align-items:center;box-shadow:0 3px 0 var(--line)}
.vrow .v-ar{font-size:28px;line-height:1.7}
.vrow .v-he{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.vrow .v-meta{grid-column:1/-1;font-size:12px;color:var(--muted)}
.vrow.long{grid-template-columns:minmax(0,1fr)}
.vrow.long .v-ar{font-size:24px}
.vempty{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:15px;padding:0 12px}

/* results */
.res{background:var(--surface);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 5px 0 var(--m)}
.res .big{font-family:var(--disp);font-size:54px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--mi)}
.res .t{font-family:var(--disp);font-size:22px;font-weight:700}
.stars{display:flex;gap:6px;margin-bottom:6px}
.star{fill:var(--surface-2);stroke:var(--line);stroke-width:1;stroke-linejoin:round}
.star.on{fill:#F5B301;stroke:#B98400}
.brow{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:14px;padding:10px 16px;box-shadow:0 3px 0 var(--line)}
.brow b{font-family:var(--disp);font-variant-numeric:tabular-nums}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px}

@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}
@media (prefers-reduced-motion: no-preference){
  .btn,.tile,.opt,.mbtn,.tok,.icon-btn{transition:transform .08s,box-shadow .08s,background-color .12s,border-color .12s}
  .opt.ok,.tok.ok,.mbtn.fresh{animation:pop .3s}
  .opt.bad,.mbtn.bad,.tok.bad{animation:shake .3s}
  .flash{animation:rise .22s}
  .res .big{animation:pop .5s}
  .star.on{animation:pop .5s both}
  .confetti i{animation:fall 2.2s linear forwards}
}
@media (prefers-reduced-motion: reduce){
  .confetti{display:none}
}

/* home pager: two swipeable pages */
.tabs{margin-bottom:0}
.tabs button{flex:1;justify-content:center}
.pager{direction:ltr;display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin-inline:-16px}
.pager::-webkit-scrollbar{display:none}
.pg{direction:rtl;flex:0 0 100%;min-width:0;box-sizing:border-box;padding:0 16px 10px;scroll-snap-align:start;scroll-snap-stop:always}
.hero.done{background:var(--h-green);color:var(--h-green-o)}
.hero.done .btn{background:var(--h-green-o);color:var(--h-green-i)}
.donerow{display:flex;align-items:center;gap:14px}
.vmark{flex:none;width:52px;height:52px;border-radius:50%;background:var(--h-green-o);color:var(--h-green-i);display:grid;place-items:center}
.vmark svg{width:30px;height:30px;stroke-width:3}

/* sun and moon */
.smcard{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line)}
.smcard h2{font-size:19px}
.smcard p{margin:0;line-height:1.6}
.smcard .ar{font-size:22px}
.smcard .note{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:8px 12px;font-size:14px}
.smsec{background:var(--cs);color:var(--ci);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.smsec.sun{--c:var(--h-orange);--cs:var(--h-orange-s);--ci:var(--h-orange-i)}
.smsec.moon{--c:var(--h-blue);--cs:var(--h-blue-s);--ci:var(--h-blue-i)}
.smsec h2{font-size:19px;display:flex;align-items:center;gap:8px}
.smsec h2 span{font-size:14px;font-weight:600;opacity:.8;margin-inline-start:auto}
.lgrid{display:flex;flex-wrap:wrap;gap:8px}
.lt{min-width:46px;height:52px;padding:0 6px;display:grid;place-items:center;border-radius:14px;background:var(--surface);color:var(--ink);border:2px solid var(--c);font-size:30px;line-height:1}
.exr{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 14px}
.exr .ar{font-size:24px;line-height:1.6}
.exr .he{font-size:14px;color:var(--muted)}

/* stories */
.scard{background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 var(--line)}
.swords{display:flex;flex-wrap:wrap;gap:2px 6px;direction:rtl}
.wd{background:none;border:0;border-bottom:2px dotted var(--line);border-radius:6px 6px 0 0;padding:2px 4px;font-size:26px;line-height:1.8;color:var(--ink);min-height:44px}
.wd.on{background:var(--ms);color:var(--mi);border-bottom-color:var(--m)}
.gloss{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ms);color:var(--mi);border-radius:14px;padding:8px 14px}
.gloss .ar{font-size:24px}
.sheb{color:var(--muted);font-size:16px;line-height:1.5;border-top:1px solid var(--line);padding-top:8px}

var KEY='roni-arabic-v1', DAY=864e5, INT=[0,1,2,4,8,16];
var WORDS=DB.words, SENTS=DB.sentences, PRINC=DB.principles;
var NAMES=DB.names.map(function(n){return {id:n.id,arabic:n.arabic,hebrew:n.hebrew,page:n.page,unit:'שמות ומקומות'};});
var UNITS=[];
WORDS.forEach(function(w){ if(UNITS.indexOf(w.unit)<0) UNITS.push(w.unit); });

var S={cards:{},scope:'all',dir:'ar',quiz:'ar2he'};
function dayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailyToday(){ return (S.daily&&S.daily.k===dayKey())?S.daily:null; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); if(o&&typeof o==='object'){ for(var k in o){ S[k]=o[k]; } } }
  }catch(e){}
  if(!S.cards||typeof S.cards!=='object') S.cards={};
  /* older saves only had level and due date: give them right/wrong counters */
  for(var id in S.cards){
    var c=S.cards[id];
    if(c&&typeof c==='object'&&c.r===undefined){ c.r=c.b||0; c.x=c.b===0?1:0; }
  }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
var view=document.getElementById('view');
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function strip(s){ return s.replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,'').replace(/[أإآٱ]/g,'ا'); }
function hebKeys(h){
  return h.split(/\s*\/\s*/).map(function(p){
    var m=p.replace(/\(.*?\)/g,'').trim().match(/^[^\s.,]+/);
    return m?m[0]:p;
  });
}
function sameMeaning(a,b){
  var ka=hebKeys(a), kb=hebKeys(b);
  return ka.some(function(x){ return kb.indexOf(x)>=0; });
}
function exampleFor(w){
  var k=strip(w.arabic);
  for(var i=0;i<SENTS.length;i++){
    var s=SENTS[i];
    if(strip(s.arabic)===k) continue;
    var toks=strip(s.arabic).split(/\s+/).map(function(t){return t.replace(/[؟،.!]/g,'');});
    if(toks.indexOf(k)>=0||toks.indexOf('ال'+k)>=0) return s;
  }
  return null;
}
function fixScope(){
  var m=/^u(\d+)$/.exec(S.scope);
  if(S.scope==='all'||S.scope==='names') return;
  if(!m||+m[1]>=UNITS.length) S.scope='all';
}
function scopeUnit(){ var m=/^u(\d+)$/.exec(S.scope); return m?UNITS[+m[1]]:null; }
function wordPool(){
  fixScope();
  if(S.scope==='names') return NAMES.slice();
  var u=scopeUnit();
  return u?WORDS.filter(function(w){return w.unit===u;}):WORDS.slice();
}
function sentPool(){
  var u=scopeUnit();
  var l=u?SENTS.filter(function(s){return s.unit===u;}):SENTS.slice();
  return l.length?l:SENTS.slice();
}
function fillPool(list,n){
  if(list.length>=n) return list.slice();
  var extra=shuffle(WORDS.filter(function(w){return list.indexOf(w)<0;}));
  return list.concat(extra).slice(0,n);
}
function pgLabel(x){ return x.page?("עמ' "+x.page):'דף העבודה'; }
function pageRange(items){
  var ps=items.map(function(x){return x.page;}).filter(function(p){return p;});
  if(!ps.length) return '';
  var a=Math.min.apply(null,ps), b=Math.max.apply(null,ps);
  return a===b?("עמ' "+a):("עמ' "+a+"–"+b);
}

/* ---------- spaced repetition + levels ----------
   Every word has a level b (0-5), a due time d, and counters r (right) / x (wrong).
   Right answer: level up and the word comes back later. Wrong answer: level drops by 2
   and it comes back right away. Words with a high error rate are flagged weak, come back
   sooner, and get picked first. New words are added gradually, in the order of the class. */
var MAXLV=5, QSIZE=10;
function errRate(c){ return c?((c.x||0)+0.5)/((c.r||0)+(c.x||0)+1):0.5; }
function isWeak(c){ return !!c&&(c.x||0)>=2&&errRate(c)>=0.4; }
function score(w,t){
  var c=S.cards[w.id]; if(!c) return 0;
  var over=Math.max(0,Math.min(7,(t-c.d)/DAY));
  return (MAXLV-c.b)+errRate(c)*4+over*0.3;
}
function cardQueue(){
  var ws=wordPool(), t=Date.now();
  var due=[], idleWeak=[], fresh=[], learning=0;
  ws.forEach(function(w){
    var c=S.cards[w.id];
    if(!c){ fresh.push(w); return; }
    if(c.b<=1) learning++;
    if(c.d<=t) due.push(w);
    else if(isWeak(c)) idleWeak.push(w);
  });
  function bySc(a,b){ return score(b,t)-score(a,t); }
  due.sort(bySc); idleWeak.sort(bySc);
  var maxNew=learning>=14?1:(learning>=8?3:5);
  var newN=Math.min(fresh.length,maxNew);
  var q=due.slice(0,QSIZE-newN).concat(fresh.slice(0,newN));
  var room=QSIZE-q.length;
  if(room>0) q=q.concat(idleWeak.slice(0,room));
  room=QSIZE-q.length;
  if(room>0) q=q.concat(fresh.slice(newN,newN+room));
  return shuffle(q);
}
/* returns the level change: positive = went up, negative = dropped */
function grade(id,ok){
  var old=S.cards[id], prev=old?old.b:0;
  var c=old||{b:0,d:0,r:0,x:0};
  c.t=Date.now();
  if(ok){
    c.r=(c.r||0)+1; c.b=Math.min(MAXLV,c.b+1);
    c.d=Date.now()+INT[c.b]*DAY*(isWeak(c)?0.5:1);
  } else {
    c.x=(c.x||0)+1; c.b=Math.max(0,c.b-2); c.d=Date.now();
  }
  S.cards[id]=c; save();
  return c.b-prev;
}
function levelStats(ws){
  var o={fresh:0,learn:0,mid:0,top:0};
  ws.forEach(function(w){
    var c=S.cards[w.id];
    if(!c) o.fresh++; else if(c.b<=1) o.learn++; else if(c.b<=3) o.mid++; else o.top++;
  });
  return o;
}
function lvBlock(ws){
  var o=levelStats(ws), tot=ws.length||1;
  var segs=[['fresh','חדשות','slate'],['learn','בלמידה','coral'],['mid','מתקדמות','orange'],['top','שולטות','green']];
  var bar=segs.map(function(s){
    return o[s[0]]?'<i style="flex:'+o[s[0]]+';background:var(--h-'+s[2]+')"></i>':'';
  }).join('');
  var leg=segs.map(function(s){
    return '<span><span class="sw" style="background:var(--h-'+s[2]+')"></span>'+s[1]+' <b>'+o[s[0]]+'</b></span>';
  }).join('');
  return '<div class="stack-s"><h2 style="font-size:18px">הרמות שלי</h2>'+
    '<div class="lvbar" role="img" aria-label="'+segs.map(function(s){return s[1]+' '+o[s[0]];}).join(', ')+' מתוך '+tot+'">'+bar+'</div>'+
    '<div class="lvleg">'+leg+'</div></div>';
}
function timesTxt(n){ return n===1?'טעית פעם אחת':'טעית '+n+' פעמים'; }
function weakRows(list){
  return list.map(function(w){
    var c=S.cards[w.id];
    return '<div class="wk"><div><div class="ar">'+esc(w.arabic)+'</div><div class="muted" style="font-size:14px">'+esc(w.hebrew)+'</div></div>'+
      '<span class="cnt">'+timesTxt(c.x||1)+'</span></div>';
  }).join('');
}
function weakList(ws,n){
  return ws.filter(function(w){ return S.cards[w.id]&&(S.cards[w.id].x||0)>=1; })
    .sort(function(a,b){
      var ca=S.cards[a.id], cb=S.cards[b.id];
      return (isWeak(cb)-isWeak(ca))||(cb.x-ca.x)||(errRate(cb)-errRate(ca));
    }).slice(0,n);
}

/* --- matching --- */
var M=null;
function match(){
  var pool=fillPool(shuffle(wordPool()),6), pairs=[], seenH=[], seenA=[];
  pool.forEach(function(w){
    if(pairs.length>=6) return;
    var dup=seenH.some(function(h){return sameMeaning(h,w.hebrew);})||seenA.indexOf(w.arabic)>=0;
    if(dup) return;
    seenH.push(w.hebrew); seenA.push(w.arabic); pairs.push(w);
  });
  var dpool=shuffle(wordPool().slice()).concat(shuffle((S.scope==='names'?NAMES:WORDS).slice()));
  M={pairs:pairs,a:shuffle(pairs.slice()),h:shuffle(pairs.slice()),selA:null,selH:null,done:{},mistakes:0,bad:null,dpool:dpool,dpos:0};
  renderMatch();
}
function renderMatch(){
  var doneN=Object.keys(M.done).length;
  function btn(side,w){
    var id=w.id, isDone=!!M.done[id];
    var sel=(side==='a'?M.selA:M.selH)===id;
    var bad=M.bad&&M.bad[side]===id;
    var cls='mbtn '+(side==='a'?'ar':'he')+(isDone?' done':'')+(M.fresh===id?' fresh':'')+(sel&&!bad?' sel':'')+(bad?' bad':'');
    var txt=esc(side==='a'?w.arabic:w.hebrew);
    return '<button class="'+cls+'" data-act="m'+side+'" data-id="'+id+'"'+(isDone?' disabled':'')+' aria-pressed="'+(sel?'true':'false')+'">'+
      (isDone?ICON.check:'')+'<span>'+txt+'</span></button>';
  }
  setView(bar('התאמה',doneN+' / '+M.pairs.length)+progress(doneN/M.pairs.length)+
    '<div class="stack"><div><div style="font-size:20px;font-weight:700;line-height:1.3">התאם כל מילה לתרגום שלה</div>'+
    '<div class="muted" style="font-size:14px">בחר מילה בערבית ואת התרגום שלה בעברית. בערבית יש גם מילים מיותרות.</div></div>'+
    '<div class="mgrid"><div class="stack-s"><div class="lbl">עברית</div>'+M.h.map(function(w){return btn('h',w);}).join('')+'</div>'+
    '<div class="stack-s"><div class="lbl">ערבית</div>'+M.a.map(function(w){return btn('a',w);}).join('')+'</div></div>'+
    '<div class="stat"><span class="muted">טעויות במשחק</span><b>'+M.mistakes+'</b></div></div>');
}
/* a decoy is an Arabic word whose translation is not on the board */
function nextDecoy(){
  while(M.dpos<M.dpool.length){
    var c=M.dpool[M.dpos++];
    var clash=M.pairs.some(function(p){
      return p.id===c.id||strip(p.arabic)===strip(c.arabic)||sameMeaning(p.hebrew,c.hebrew);
    })||M.a.some(function(x){ return strip(x.arabic)===strip(c.arabic); });
    if(!clash) return c;
  }
  return null;
}
function swapArabic(id){
  var idx=-1;
  M.a.forEach(function(w,i){ if(w.id===id) idx=i; });
  var d=nextDecoy();
  if(idx>=0&&d) M.a[idx]=d;
  M.fresh=null;
  renderMatch();
}
function matchPick(side,id){
  if(M.done[id]||M.bad) return;
  M.fresh=null;
  if(side==='a') M.selA=id; else M.selH=id;
  if(M.selA&&M.selH){
    if(M.selA===M.selH){
      var okId=M.selA; M.done[okId]=true; M.fresh=okId; M.selA=null; M.selH=null;
      if(Object.keys(M.done).length===M.pairs.length){
        renderMatch();
        later(function(){
          resultsView('התאמה',String(M.mistakes),M.mistakes===0?'בלי אף טעות':'טעויות בסבב','כל הזוגות הותאמו.','match',M.mistakes===0?3:(M.mistakes<=2?2:1));
        },450);
        return;
      }
      var g=M;
      later(function(){ if(M===g) swapArabic(okId); },400);
    } else {
      M.mistakes++; M.bad={a:M.selA,h:M.selH}; M.selA=null; M.selH=null;
      renderMatch();
      later(function(){ if(M){ M.bad=null; renderMatch(); } },650);
      return;
    }
  }
  renderMatch();
}
ACT.ma=function(d){ matchPick('a',d.id); };
ACT.mh=function(d){ matchPick('h',d.id); };

/* --- quiz and general exam --- */
var Q=null;
function plain(t){ return t.replace(/[؟،.!]/g,''); }
function mkWordQ(w,he2ar,dp){
  var others=shuffle(dp.filter(function(x){
    return x.id!==w.id&&x.arabic!==w.arabic&&!sameMeaning(x.hebrew,w.hebrew);
  })).slice(0,3);
  var opts=shuffle([w].concat(others).map(function(x){return {t:he2ar?x.arabic:x.hebrew,ok:x.id===w.id};}));
  return {kind:he2ar?'he2ar':'ar2he',w:w,opts:opts,tag:dp===NAMES?'שמות ומקומות':'מילים'};
}
function mkSentQ(s){
  var others=shuffle(SENTS.filter(function(x){return x.hebrew!==s.hebrew;})).slice(0,3);
  var opts=shuffle([{t:s.hebrew,ok:true}].concat(others.map(function(o){return {t:o.hebrew,ok:false};})));
  return {kind:'sent',s:s,opts:opts,tag:'משפטים'};
}
function mkSent2ArQ(s){
  var n=s.arabic.split(/\s+/).length;
  var pool=SENTS.filter(function(x){return x.arabic!==s.arabic&&x.hebrew!==s.hebrew;});
  var near=pool.filter(function(x){return Math.abs(x.arabic.split(/\s+/).length-n)<=1;});
  var src=shuffle((near.length>=3?near:pool).slice()).slice(0,3);
  var opts=shuffle([{t:s.arabic,ok:true}].concat(src.map(function(o){return {t:o.arabic,ok:false};})));
  return {kind:'sent2ar',s:s,opts:opts,tag:'משפטים'};
}
/* blank out one word that is in the vocabulary; the Hebrew translation of the whole sentence is the hint */
function mkBlankQ(s){
  var toks=s.arabic.split(/\s+/), cand=[];
  toks.forEach(function(t,i){
    var core=plain(t);
    var w=WORDS.filter(function(x){return strip(x.arabic)===strip(core);})[0];
    if(w) cand.push({i:i,w:w,core:core});
  });
  if(!cand.length) return null;
  var c=cand[Math.floor(Math.random()*cand.length)];
  var inS=toks.map(function(t){return strip(plain(t));});
  var others=shuffle(WORDS.filter(function(x){
    return x.id!==c.w.id&&inS.indexOf(strip(x.arabic))<0&&!sameMeaning(x.hebrew,c.w.hebrew);
  })).slice(0,3);
  if(others.length<3) return null;
  var blanked=toks.map(function(t,k){return k===c.i?'_____':t;}).join(' ');
  var opts=shuffle([{t:c.core,ok:true}].concat(others.map(function(x){return {t:x.arabic,ok:false};})));
  return {kind:'blank',s:s,blanked:blanked,w:c.w,opts:opts,tag:'השלמה'};
}
function quiz(){
  var qs=[];
  if(S.quiz==='sent'){
    qs=shuffle(sentPool()).slice(0,10).map(function(s){return mkSentQ(s);});
  } else {
    var dp=S.scope==='names'?NAMES:WORDS, he2ar=(S.quiz==='he2ar');
    qs=shuffle(wordPool()).slice(0,10).map(function(w){return mkWordQ(w,he2ar,dp);});
  }
  Q={qs:qs,i:0,picked:null,score:0,exam:false,log:[]};
  renderQuiz();
}
function exam(){
  var Wd=shuffle(WORDS.slice()), Nm=shuffle(NAMES.slice()), Se=shuffle(SENTS.slice());
  var a=Wd.slice(0,4).map(function(w){return mkWordQ(w,false,WORDS);}).concat(Nm.slice(0,1).map(function(w){return mkWordQ(w,false,NAMES);}));
  var b=Wd.slice(4,7).map(function(w){return mkWordQ(w,true,WORDS);}).concat(Nm.slice(1,2).map(function(w){return mkWordQ(w,true,NAMES);}));
  var c=Se.slice(0,3).map(function(s){return mkSentQ(s);});
  var d=Se.slice(3,6).map(function(s){return mkSent2ArQ(s);});
  var e=[];
  for(var i=6;i<Se.length&&e.length<5;i++){ var bq=mkBlankQ(Se[i]); if(bq) e.push(bq); }
  Q={qs:shuffle(a).concat(shuffle(b),c,d,e),i:0,picked:null,score:0,exam:true,log:[]};
  renderQuiz();
}
function renderQuiz(){

  else if(q.kind==='smL'){ lab='האות הזאת היא אות...'; prompt='<div class="ar q-ar" style="font-size:72px;line-height:1.3">'+esc(q.letter)+'</div>'; }
  else if(q.kind==='smW'){ lab='המילה מתחילה באות...'; prompt='<div class="ar q-ar">'+esc(q.word.arabic)+'</div><div class="muted">'+esc(q.word.hebrew)+'</div>'; }
  else if(q.kind==='smF'){ lab='איך נכון לכתוב ולהגות עם ال?'; prompt='<div class="q-he">'+esc(q.word.hebrew)+'</div><div class="ar q-ar" style="font-size:34px">ال + '+esc(q.word.arabic)+'</div>'; }

  }).join('');

    } else if(q.kind==='ar2he'||q.kind==='he2ar'){

      body='<div class="lbl">'+esc(q.w.arabic)+' · '+esc(q.w.hebrew)+'</div>';

function quizDone(){

  var sub=isBest?(prev?'שיא חדש!':'זה השיא הראשון שלך.'):('השיא שלך: '+prev.s+' / '+prev.t);

/* --- sentence builder --- */
var T=null;
function sentOk(s){ var n=s.arabic.split(/\s+/).length; return n>=3&&n<=8; }
function sentence(){
  var pl=sentPool().filter(sentOk);
  if(pl.length<3) pl=SENTS.filter(sentOk);
  var allToks=[];
  SENTS.forEach(function(s){ s.arabic.split(/\s+/).forEach(function(t){ if(t.indexOf('؟')<0) allToks.push(t); }); });
  var list=shuffle(pl).slice(0,8).map(function(s){
    var toks=s.arabic.split(/\s+/);
    var have=toks.map(strip), extra=[];
    shuffle(allToks.slice()).forEach(function(t){
      if(extra.length>=2) return;
      var st=strip(t);
      if(have.indexOf(st)>=0||extra.some(function(e){return strip(e)===st;})) return;
      extra.push(t);
    });
    var bank=shuffle(toks.concat(extra).map(function(t,k){return {k:k,t:t};}));
    return {s:s,toks:toks,bank:bank};
  });
  T={list:list,i:0,placed:[],checked:null,ok:0};
  renderSentence();
}
function renderSentence(){
  if(T.i>=T.list.length) return sentDone();
  var it=T.list[T.i], checked=T.checked!==null;
  var byK={}; it.bank.forEach(function(b){byK[b.k]=b;});
  var placedHtml=T.placed.map(function(k){
    var cls='tok placed'+(checked?(T.checked?' ok':' bad'):'');
    return '<button class="'+cls+'" data-act="tunplace" data-k="'+k+'"'+(checked?' disabled':'')+' aria-label="הסר את המילה '+esc(byK[k].t)+'">'+esc(byK[k].t)+'</button>';
  }).join('');
  var ghosts='';
  if(!checked){ for(var g=T.placed.length;g<it.toks.length&&g<T.placed.length+2;g++) ghosts+='<div class="ghost"></div>'; }
  var bankHtml=it.bank.filter(function(b){return T.placed.indexOf(b.k)<0;}).map(function(b){
    return '<button class="tok" data-act="tpick" data-k="'+b.k+'"'+(checked?' disabled':'')+'>'+esc(b.t)+'</button>';
  }).join('');
  var fb='';
  if(checked){
    fb='<div class="feedback" aria-live="polite"><div class="v">'+(T.checked?'נכון!':'לא מדויק. התשובה הנכונה:')+'</div>'+
      (T.checked?'':'<div class="ar" style="font-size:28px">'+esc(it.s.arabic)+'</div>')+
      '<div class="lbl">'+pgLabel(it.s)+' · '+esc(it.s.unit)+'</div></div>';
  }
  setView(bar('בניית משפט',(T.i+1)+' / '+T.list.length)+progress(T.i/T.list.length)+
    '<div class="stack"><div class="stack-s"><div class="muted" style="font-size:14px">הרכב בערבית את המשפט:</div><div class="sent-he">'+esc(it.s.hebrew)+'</div></div>'+
    '<div class="slot-area" aria-label="המשפט שהרכבת">'+placedHtml+ghosts+'</div>'+
    (checked?'':'<div class="stack-s"><div class="lbl">מילים לבחירה</div><div class="bank">'+bankHtml+'</div></div>')+
    fb+
    (checked
      ? '<button class="btn btn-primary sticky" data-act="tnext">'+(T.i+1>=T.list.length?'לתוצאה':'למשפט הבא')+'</button>'
      : '<div class="row2 sticky"><button class="btn btn-soft" data-act="tclear"'+(T.placed.length?'':' disabled')+'>נקה</button><button class="btn btn-primary" data-act="tcheck"'+(T.placed.length?'':' disabled')+'>בדיקה</button></div>')+
    '</div>');
}
function sentDone(){
  resultsView('בניית משפט',T.ok+' / '+T.list.length,T.ok===T.list.length?'מושלם':'סיימת את הסבב',
    'המשפט נחשב נכון רק כשהסדר שלו מדויק.','sentence',starsFor(T.list.length?T.ok/T.list.length:0));
}
ACT.tpick=function(d){ if(T.checked!==null) return; T.placed.push(+d.k); renderSentence(); };
ACT.tunplace=function(d){ if(T.checked!==null) return; var k=+d.k; T.placed=T.placed.filter(function(x){return x!==k;}); renderSentence(); };
ACT.tclear=function(){ T.placed=[]; renderSentence(); };
ACT.tcheck=function(){
  var it=T.list[T.i], byK={};
  it.bank.forEach(function(b){byK[b.k]=b;});
  var ans=T.placed.map(function(k){return byK[k].t;}).join(' ');
  T.checked=(ans===it.s.arabic);
  if(T.checked) T.ok++;
  renderSentence();
};
ACT.tnext=function(){ T.i++; T.placed=[]; T.checked=null; renderSentence(); window.scrollTo(0,0); };

var SUN='ت ث د ذ ر ز س ش ل ن'.split(' '), MOON='ا ب ع غ ف ق ك م ه و ي'.split(' ');
var SUN_IDS=['w001','w002','w005','w006','w016','w020','w023','w025','w026','w035','w054','w070','w081','شَرْق','شِمَال','لُغَة'];
var MOON_IDS=['w010','w011','w012','w013','w014','w015','w018','w027','w036','w039','w040','w047','w049','w050','w051','w052','w053','w055','w056','w059','w061','w064','w068','w069','w071','w072','w073','w074','w075','w076','w080','غَرْب','عَرَبِيّ','عِبْرِيّ','كُرَة','مَدْرَسَة','قِسْم','مُغَنِّي','مَشْهُور'];
function smWords(ids){ return ids.map(function(id){return WORDS.filter(function(w){return w.id===id||strip(w.arabic)===strip(id);})[0];}).filter(Boolean); }
function firstLetter(w){ return strip(w.arabic).charAt(0); }
function formSun(w){ var a=w.arabic; return 'ال'+a.charAt(0)+'ّ'+a.slice(1); }
function formMoon(w){ return 'الْ'+w.arabic; }
function formOf(w,sun){ return sun?formSun(w):formMoon(w); }
function ruleText(sun){ return sun?'אות שמש: האות ל של ال לא נהגית והאות הראשונה נהגית כפולה':'אות ירח: האות ל של ال נהגית כרגיל'; }
function smOpts(sun){ return [{t:'אות שמש',ok:sun},{t:'אות ירח',ok:!sun}]; }
function smLetterQ(l,sun){
  var ws=smWords(sun?SUN_IDS:MOON_IDS).filter(function(w){return firstLetter(w)===l;});
  var ex=ws[0];
  return {kind:'smL',letter:l,opts:smOpts(sun),tag:'שמש וירח',
    expl:{text:l+' היא '+ruleText(sun),ex:ex?formOf(ex,sun):'',exHe:ex?ex.hebrew:''}};
}
function smWordQ(w,sun){
  var l=firstLetter(w);
  return {kind:'smW',word:w,opts:smOpts(sun),tag:'שמש וירח',
    expl:{text:'המילה מתחילה ב-'+l+', '+ruleText(sun),ex:formOf(w,sun),exHe:w.hebrew}};
}
function smFormQ(w,sun){
  var l=firstLetter(w), right=formOf(w,sun), wrong=formOf(w,!sun);
  return {kind:'smF',word:w,opts:shuffle([{t:right,ok:true},{t:wrong,ok:false}]),tag:'שמש וירח',
    expl:{text:'המילה מתחילה ב-'+l+', '+ruleText(sun),ex:right,exHe:w.hebrew}};
}
function smQuiz(){
  var sw=smWords(SUN_IDS), mw=smWords(MOON_IDS);
  var letters=shuffle(SUN.map(function(l){return {l:l,sun:true};}).concat(MOON.map(function(l){return {l:l,sun:false};})));
  var qs=letters.slice(0,5).map(function(x){return smLetterQ(x.l,x.sun);});
  var pool=shuffle(sw.map(function(w){return {w:w,sun:true};}).concat(shuffle(mw.slice()).slice(0,sw.length).map(function(w){return {w:w,sun:false};})));
  pool.slice(0,5).forEach(function(x){ qs.push(smWordQ(x.w,x.sun)); });
  var rest=pool.slice(5).filter(function(x){var ch=x.w.arabic.charAt(0); return ch!=='أ'&&ch!=='إ';});
  rest.slice(0,5).forEach(function(x){ qs.push(smFormQ(x.w,x.sun)); });
  Q={qs:shuffle(qs),i:0,picked:null,score:0,exam:false,log:[],mode:'sunmoon',title:'שמש וירח'};
  renderQuiz();
}

      '<p><b>אות שמש:</b> האות ל של ال לא נהגית, והאות הראשונה נהגית כפולה (מסומן בשדה ـّ). למשל <span class="ar">الشَّمْس</span> (אש-שמס), "השמש".</p>'+

var PERSONS=['אני','אתה','את','הוא','היא'];
var VERBS=[
  {ar:'كَتَبَ',he:'כתב',f:['كَتَبْتُ','كَتَبْتَ','كَتَبْتِ','كَتَبَ','كَتَبَتْ']},

  {ar:'سَافَرَ',he:'נסע',f:['سَافَرْتُ','سَافَرْتَ','سَافَرْتِ','سَافَرَ','سَافَرَتْ']},
  {ar:'لَعِبَ',he:'שיחק',f:['لَعِبْتُ','لَعِبْتَ','لَعِبْتِ','لَعِبَ','لَعِبَتْ']},
  {ar:'هَرَبَ',he:'ברח',f:['هَرَبْتُ','هَرَبْتَ','هَرَبْتِ','هَرَبَ','هَرَبَتْ']}
];
function anyFind(a){ var k=strip(a); return WORDS.concat(NAMES).filter(function(w){return strip(w.arabic)===k;})[0]; }
function nFind(h){ return NAMES.filter(function(n){return n.hebrew===h;})[0]; }
function wGroups(){
  return [
    {name:'מדינות וערים',items:['איראן','דובאי','יפן','לונדון','לבנון','ביירות','יוון','תל אביב','נתניה','נהריה'].map(nFind).filter(Boolean)},
    {name:'כיוונים ומיקום',items:['غَرْب','شِمَال','شَرْق','فَوْقَ','هُنَا','هُنَاكَ'].map(anyFind).filter(Boolean)},
    {name:'מוסדות',items:['مَدْرَسَة','بَنْك','مَكْتَب','بَرْلَمَان'].map(anyFind).filter(Boolean)}
  ];
}
var ODD_FIXED=[
  {items:['شَرْق','غَرْب','شِمَال'],odd:'كُرَة',why:'שלוש המילים האחרות הן כיוונים, וכדור אינו כיוון'},
  {items:['سَمِعَ','سَافَرَ','لَعِبَ'],odd:'مَدْرَسَة',why:'שלוש המילים האחרות הן פעלים, ובית ספר הוא שם עצם'},
  {items:['عَرَبِيّ','عِبْرِيّ','لُغَة'],odd:'بَنْك',why:'שלוש המילים האחרות קשורות לשפה, ובנק לא'},
  {items:['إيرَان','يَابَان','لَنْدَن'],odd:'قِسْم',why:'שלוש המילים האחרות הן מדינות וערים, ומחלקה לא'}
];
function wSortQ(g,item,groups){
  return {kind:'wS',item:item,opts:groups.map(function(x){return {t:x.name,ok:x===g};}),tag:'מיון',
    expl:{text:'הקבוצה: '+g.name,ex:item.arabic,exHe:item.hebrew}};
}
function wOddQ(items,odd,why){
  var all=items.concat([odd]);
  if(all.some(function(x){return !x;})) return null;
  return {kind:'wO',opts:shuffle(all.map(function(x){return {t:x.arabic,ok:x===odd};})),tag:'מי לא שייך',
    expl:{text:why,ex:odd.arabic,exHe:odd.hebrew}};
}
function wOddFixedQ(f){ return wOddQ(f.items.map(anyFind),anyFind(f.odd),f.why); }
function wOddGenQ(gs){
  var a=shuffle(gs.filter(function(g){return g.items.length>=3;}))[0];
  var b=shuffle(gs.filter(function(g){return g!==a;}))[0];
  var three=shuffle(a.items.slice()).slice(0,3), odd=shuffle(b.items.slice())[0];
  return wOddQ(three,odd,'שלוש המילים האחרות הן מהקבוצה "'+a.name+'", והמילה הזאת שייכת ל"'+b.name+'"');
}
function wPersonOpts(pi){
  var others=shuffle([0,1,2,3,4].filter(function(i){return i!==pi;})).slice(0,3);
  return shuffle([pi].concat(others));
}
function wConjFQ(v,pi){
  return {kind:'wCF',verb:v,pi:pi,tag:'הטיה',
    opts:wPersonOpts(pi).map(function(i){return {t:v.f[i],ok:i===pi};}),
    expl:{text:PERSONS[pi]+' · '+v.he,ex:v.f[pi],exHe:v.he}};
}
function wConjPQ(v,pi){
  return {kind:'wCP',verb:v,pi:pi,form:v.f[pi],tag:'הטיה',
    opts:wPersonOpts(pi).map(function(i){return {t:PERSONS[i],ok:i===pi};}),
    expl:{text:'הסיומת קובעת את הגוף: '+PERSONS[pi],ex:v.f[pi],exHe:v.he}};
}
function workQuiz(){
  var gs=wGroups(), qs=[], all=[];
  gs.forEach(function(g){ g.items.forEach(function(it){ all.push({g:g,it:it}); }); });
  shuffle(all).slice(0,5).forEach(function(x){ qs.push(wSortQ(x.g,x.it,gs)); });
  shuffle(ODD_FIXED.slice()).slice(0,3).forEach(function(f){ var o=wOddFixedQ(f); if(o) qs.push(o); });
  for(var k=0;k<2;k++){ var o2=wOddGenQ(gs); if(o2) qs.push(o2); }
  var vs=shuffle(VERBS.slice());
  for(var i=0;i<5;i++){
    var pi=Math.floor(Math.random()*5);
    qs.push(i<3?wConjFQ(vs[i],pi):wConjPQ(vs[i],pi));
  }
  Q={qs:shuffle(qs),i:0,picked:null,score:0,exam:false,log:[],mode:'work',title:'מיון והטיות'};
  renderQuiz();
}

function normHe(s){

function normAr(s){
  return strip(s).replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[؟،]/g,'');
}
function vidx(){
  if(VIDX) return VIDX;
  VIDX=[];
  function add(type,list){
    list.forEach(function(x){
      var he=normHe(x.hebrew), ar=normAr(x.arabic);
      VIDX.push({type:type,x:x,he:he,ar:ar,
        heT:he.split(/[^א-ת]+/).filter(Boolean),
        arT:ar.split(/\s+/).filter(Boolean)});
    });
  }
  add('w',WORDS); add('n',NAMES); add('s',SENTS);
  return VIDX;
}
function vquery(raw){
  var s=raw.trim();
  var hasAr=/[؀-ۿ]/.test(s), hasHe=/[א-ת]/.test(s);
  var q={ar:[],he:'',empty:!s,latin:!!s&&!hasAr&&!hasHe};
  if(hasAr){
    var a=normAr(s).replace(/\s+/g,' ').trim(); q.ar=[a];
    var b=a.replace(/^ال/,''); if(b&&b!==a) q.ar.push(b);
  }
  if(hasHe) q.he=normHe(s).replace(/[^א-ת\s]/g,'').replace(/\s+/g,' ').trim();
  return q;
}
/* 0 exact word, 1 word starts with, 2 contained; null no match */
function vscore(it,q){
  if(q.empty) return 0;
  var best=null;
  function take(s){ if(best===null||s<best) best=s; }
  q.ar.forEach(function(v){
    if(it.arT.some(function(t){return t===v||t==='ال'+v;})) take(0);
    else if(it.arT.some(function(t){return t.indexOf(v)===0||t.indexOf('ال'+v)===0;})) take(1);
    else if(it.ar.indexOf(v)>=0) take(2);
  });
  if(q.he){
    if(it.heT.indexOf(q.he)>=0) take(0);
    else if(it.heT.some(function(t){return t.indexOf(q.he)===0;})) take(1);
    else if(it.he.indexOf(q.he)>=0) take(2);
  }
  return best;
}
function vresults(){
  var q=vquery(V.q), out={w:[],n:[],s:[]};
  vidx().forEach(function(it,i){
    var sc=vscore(it,q);
    if(sc!==null) out[it.type].push({it:it,sc:sc,i:i});
  });
  ['w','n','s'].forEach(function(t){ out[t].sort(function(a,b){return a.sc-b.sc||a.i-b.i;}); });
  return out;
}
function vrow(it){
  var x=it.x;
  return '<div class="vrow'+(it.type==='s'?' long':'')+'"><div class="v-ar ar">'+esc(x.arabic)+'</div>'+
    '<div class="v-he">'+esc(x.hebrew)+'</div>'+
    '<div class="v-meta">'+pgLabel(x)+(x.unit?' · '+esc(x.unit):'')+'</div></div>';
}
function vocabDyn(){
  var r=vresults(), total=r.w.length+r.n.length+r.s.length, q=vquery(V.q);
  function chip(k,label,n){ return '<button data-act="vf" data-v="'+k+'" aria-pressed="'+(V.f===k)+'">'+label+' '+n+'</button>'; }
  var chips='<div class="seg" role="group" aria-label="סוג תוצאות">'+chip('all','הכול',total)+chip('w','מילים',r.w.length)+
    chip('n','שמות ומקומות',r.n.length)+chip('s','משפטים',r.s.length)+'</div>';
  var groups='';
  ['w','n','s'].forEach(function(t){
    if((V.f!=='all'&&V.f!==t)||!r[t].length) return;
    groups+='<div class="vgroup"><h2>'+VLAB[t]+'<span>'+r[t].length+'</span></h2>'+r[t].map(function(m){return vrow(m.it);}).join('')+'</div>';
  });
  var shown=V.f==='all'?total:r[V.f].length;
  if(!shown){
    groups='<div class="vempty" aria-live="polite">'+(q.latin
      ?'החיפוש עובד בעברית ובערבית. אפשר לכתוב בלי ניקוד.'
      :(total?'אין תוצאות בסוג הזה. בחר "הכול" כדי לראות את שאר התוצאות.':'לא נמצאו תוצאות. נסה חלק מהמילה, או כתוב בלי ניקוד.'))+'</div>';
  }
  return chips+groups;
}
function vupdate(){
  var el=document.getElementById('vdyn');
  if(el) el.innerHTML=vocabDyn();
}
function vocab(){
  V.q=''; V.f='all';
  setView(bar('אוצר מילים','')+
    '<div class="stack"><input class="search" id="q" type="search" dir="auto" placeholder="חפש בעברית או בערבית" aria-label="חיפוש באוצר המילים" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">'+
    '<div class="muted" style="font-size:14px">אפשר לחפש בלי ניקוד ובכל חלק של המילה.</div>'+
    '<div id="vdyn" class="stack">'+vocabDyn()+'</div></div>');
}
ACT.vf=function(d){ V.f=d.v; vupdate(); };

/* --- look: one hue per screen, Arabic letters in the background --- */
var MODES={start:'teal',home:'teal',cards:'teal',match:'orange',quiz:'purple',exam:'coral',principles:'blue',sentence:'pink',vocab:'green',sunmoon:'orange',work:'green',stories:'purple'};
var GLYPHS='ا ب ت ث د ذ ر ز ن م ل ك ف ق ه و ي'.split(' ');
function buildBg(){
  var bg=document.getElementById('bg'); if(!bg) return;
  var seed=7;
  function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }
  var cols=4, rows=7, html='';
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var g=GLYPHS[(r*cols+c*3+r)%GLYPHS.length];
      var size=48+Math.round(rnd()*72);
      var left=(c+rnd()*0.6)*(100/cols)-4, top=(r+rnd()*0.6)*(100/rows)-3;
      var rot=Math.round(rnd()*50-25);
      html+='<span class="g" style="left:'+left.toFixed(1)+'%;top:'+top.toFixed(1)+'%;font-size:'+size+'px;transform:rotate('+rot+'deg)">'+g+'</span>';
    }
  }
  bg.innerHTML=html;
}

/* ---------- router ---------- */
var ROUTES={start:start,home:home,cards:cards,match:match,quiz:quiz,principles:principles,sentence:sentence,vocab:vocab,exam:exam,sunmoon:sunmoon,work:work,stories:stories};
function route(){
  timers.forEach(clearTimeout); timers=[];
  var h=(location.hash||'').replace('#','');
  var name=ROUTES[h]?h:'start';
  confirmReset=false;
  view.className='m-'+(MODES[name]||'teal');
  if(name!=='home') HP=0;
  ROUTES[name]();
  window.scrollTo(0,0);
}
function go(name,force){
  if(location.hash==='#'+name){ route(); }
  else { location.hash=name; }
}

view.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t||t.disabled) return;
  var f=ACT[t.dataset.act];
  if(f) f(t.dataset,t);
});
view.addEventListener('change',function(e){
  if(e.target&&e.target.id==='scope'){ S.scope=e.target.value; save(); home(); }
});
view.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){ V.q=e.target.value; vupdate(); }
});
window.addEventListener('hashchange',route);

load();
buildBg();
route();
})();
</script>
